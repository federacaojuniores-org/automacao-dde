name: Planilhas das EJs (manual)

# Roda só a Fase 3 (distribuição para as planilhas das EJs), sem baixar os relatórios do Portal.
# Útil para testar ou reprocessar depois de mexer no modelo ou na aba de acessos.
on:
  workflow_dispatch:
    inputs:
      ejs:
        description: "IDs das EJs separados por espaço (vazio = todas da aba de acessos)"
        required: false
        default: ""

jobs:
  sync-ejs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Google Credentials File
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > dde-projeto-9ed22179e048.json

      - name: Update EJ spreadsheets
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: dde-projeto-9ed22179e048.json
          EJS: ${{ github.event.inputs.ejs }}
        run: |
          ARGS=""
          for id in $EJS; do ARGS="$ARGS --ej $id"; done
          python sync_planilhas_ejs.py $ARGS
