name: Daily Tracking Synchronization

# Disparado às 05:30 e 17:30 de Brasília pelo cron-job.org (cronjob "Disparo tracking DDE"),
# que chama a API de workflow_dispatch com o token "cron-job disparo tracking".
# Não usa o agendamento do GitHub porque ele atrasava horas. Também pode ser rodado à mão.
on:
  workflow_dispatch:

# não roda ao mesmo tempo que a atualização das planilhas das EJs
concurrency:
  group: tracking
  cancel-in-progress: false

jobs:
  sync:
    name: Run Daily Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium Browser
        run: |
          playwright install chromium

      - name: Create Google Credentials File
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > dde-projeto-9ed22179e048.json

      - name: Execute Daily Sync Script
        env:
          PORTAL_EMAIL: ${{ secrets.PORTAL_EMAIL }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: dde-projeto-9ed22179e048.json
        run: |
          mkdir -p downloads
          python daily_sync.py

      - name: Upload Error Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots
          path: |
            *.png
            downloads/*.png
            /Users/Arthur/Documents/Juniores/*.png
          if-no-files-found: ignore
